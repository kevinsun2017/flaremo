name: upstream-sync

# 方案 C：每天把上游 FlareMo 最新 release 变成一个**待人工审阅的 PR**，绝不自动合并。
# 采用「快照替换」而非 git merge —— 因为本仓库由 Cloudflare 的 source repo import 建立，
# 与上游没有任何共同祖先，merge 会直接 fatal: refusing to merge unrelated histories。
# 你点 Merge → 推 main → Cloudflare Workers Builds 自动：构建 → pnpm migrate:remote → 部署。

# 手动触发（教主决定：钉在 v0.28，Agent 面板+技能由我们自己长期持有，
# 因此不再自动追版本。每次手动同步前必须先扫上游 release notes 的安全项再决定合不合。）
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "指定上游 tag（留空 = 最新 release）"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM: realchendahuang/FlareMo
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: 配置 git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 决定目标 tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          T="${{ github.event.inputs.tag }}"
          [ -z "$T" ] && T=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          echo "value=$T" >> "$GITHUB_OUTPUT"
          CUR=$(cat .upstream-tag 2>/dev/null || echo "none")
          echo "  本仓库当前上游版本: $CUR"
          echo "  目标上游版本:       $T"
          if [ "$CUR" = "$T" ]; then
            echo "已是最新，无需同步"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 拉上游快照
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          if ! git clone -q --depth 1 --branch "$TAG" "https://github.com/$UPSTREAM.git" /tmp/up; then
            echo "git 克隆失败，改用 release tarball 兜底"
            mkdir -p /tmp/up
            gh api "repos/$UPSTREAM/tarball/refs/tags/$TAG" > /tmp/up.tgz
            tar xzf /tmp/up.tgz -C /tmp/up --strip-components=1
          fi
          # 快照替换：删掉上游已移除的文件，但保护我们自己的覆盖件
          rsync -a --delete \
            --exclude=.git \
            --exclude=wrangler.jsonc \
            --exclude=.gitattributes \
            --exclude=.upstream-tag \
            --exclude=patches \
            --exclude=.github \
            /tmp/up/ ./
          echo "$TAG" > .upstream-tag

          # ── 本地补丁必须重新贴回 ──────────────────────────────
          # 快照替换会把上游已有文件恢复成原样，因此本仓库对上游文件的改动
          # 一律以 patches/*.patch 保存。打不上就失败：宁可红着，也不要静默丢掉功能。
          if compgen -G "patches/*.patch" > /dev/null; then
            if git apply --check patches/*.patch 2>/dev/null; then
              git apply patches/*.patch
              echo "已重新贴回 $(ls patches/*.patch | wc -l | tr -d ' ') 个本地补丁"
            else
              echo "::error::patches/ 里的本地补丁与 ${TAG} 冲突，需人工重做（步骤见 patches/README.md）。本次同步不可合并。"
              for f in patches/*.patch; do
                echo "  - $f："
                git apply --check "$f" 2>&1 | sed 's/^/      /'
              done
              exit 1
            fi
          fi

      - name: 开同步 PR
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -euo pipefail
          BRANCH="upstream-sync/${TAG}"
          git checkout -B "$BRANCH"
          if git diff --cached --quiet && git diff --quiet; then
            echo "没有实际变化"; exit 0
          fi
          git add -A
          git commit -q -m "sync: FlareMo ${TAG}（快照替换）"
          git push -q -f origin "$BRANCH"

          MIG=$(git diff --name-only "origin/main...HEAD" | grep -E '^migrations/.*\.sql$' | sed 's/^/- 🗄 /' || true)
          NEWCI=$(git diff --name-only "origin/main...HEAD" | grep -E '^\.github/workflows/' | sed 's/^/- ⚠️ /' || true)
          CNT=$(git diff --name-only "origin/main...HEAD" | wc -l | tr -d ' ')
          OLD=$(git show "origin/main:.upstream-tag" 2>/dev/null || echo "未知")
          NOTES=$(gh api "repos/$UPSTREAM/releases/tags/$TAG" --jq .body 2>/dev/null || echo "（取不到 release 说明）")

          {
            echo "## ⬆️ 上游同步：${OLD} → ${TAG}"
            echo
            echo "变更文件 **${CNT}** 个。合并本 PR = 推送 main = **Workers Builds 自动构建 → 应用迁移 → 部署 Worker**。"
            echo
            [ -n "$MIG" ] && echo "### 本次会应用的 D1 迁移" && echo "$MIG" && echo
            [ -n "$NEWCI" ] && echo "### ⚠️ 上游带来/改动的 CI 文件（请审查）" && echo "$NEWCI" && echo
            echo "### 合并前建议"
            echo "1. 通读下面的上游 release 说明，注意「升级步骤」里有没有额外手工动作"
            echo "2. Cloudflare 控制台导出一次 D1 备份（**迁移不可回滚**）"
            echo "3. 确认无误再 Merge，然后到 Workers Builds 看构建是否绿色"
            echo
            echo "本 PR 由 upstream-sync 工作流自动生成（快照替换，非 git merge：本仓库与上游无共同祖先）。"
            echo "本地覆盖件已受保护：\`wrangler.jsonc\`（D1 UUID + 生产 origin）、\`.gitattributes\`、\`.github/\`、\`.upstream-tag\`。"
            echo
            echo "---"
            echo
            echo "### 上游 release 说明（${TAG}）"
            echo
            echo "$NOTES"
          } > /tmp/body.md

          gh pr close "$BRANCH" --comment "被 ${TAG} 的新同步 PR 取代" 2>/dev/null || true
          URL=$(gh pr create --base main --head "$BRANCH" \
                 --title "sync: FlareMo ${TAG}" \
                 --label upstream-sync \
                 --body-file /tmp/body.md)
          echo "已开 PR：$URL"
